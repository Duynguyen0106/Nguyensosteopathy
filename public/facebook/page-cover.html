    .wash {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(105deg,
          rgba(6,24,40,0.94) 0%,
          rgba(11,44,69,0.88) 38%,
          rgba(10,58,74,0.55) 62%,
          rgba(6,24,40,0.35) 100%),
        linear-gradient(180deg,
          rgba(6,24,40,0.25) 0%,
          transparent 35%,
          rgba(6,24,40,0.55) 100%);
    }
    .grain {
      position: absolute;
      inset: 0;
      opacity: 0.07;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      pointer-events: none;
    }
    .content {
      position: relative;
      z-index: 2;
      height: 100%;
      /* Leave left clear for Facebook profile photo overlap */
      padding: 48px 64px 44px 340px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 10px;
    }
    .logo {
      position: absolute;
      top: 36px;
      right: 56px;
      z-index: 3;
      background: #fff;
      border-radius: 14px;
      padding: 10px 12px;
      box-shadow: 0 10px 28px rgba(0,0,0,0.28);
    }
    .logo img {
      display: block;
      height: 72px;
      width: auto;
      max-width: 180px;
      object-fit: contain;
    }
    .eyebrow {
      font-size: 15px;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      font-weight: 700;
      color: #2dd4bf;
    }
    h1 {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 64px;
      line-height: 0.98;
      font-weight: 700;
      max-width: 14ch;
      text-shadow: 0 2px 24px rgba(0,0,0,0.35);
    }
    .support {
      margin-top: 4px;
      max-width: 38ch;
      font-size: 22px;
      line-height: 1.35;
      font-weight: 500;
      color: rgba(255,255,255,0.9);
    }
    .cta-row {
      margin-top: 18px;
      display: flex;
      align-items: center;
      gap: 22px;
      flex-wrap: wrap;
    }
    .cta {
      display: inline-flex;
      align-items: center;
      background: #2dd4bf;
      color: #061828;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      padding: 14px 26px;
      border-radius: 4px;
    }
    .hours {
      font-size: 17px;
      font-weight: 600;
      color: rgba(255,255,255,0.86);
    }
    .footer {
      position: absolute;
      left: 340px;
      right: 64px;
      bottom: 28px;
      z-index: 3;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 24px;
      font-size: 15px;
      font-weight: 600;
      color: rgba(255,255,255,0.72);
    }
    .footer strong {
      color: #99f6e4;
      font-weight: 700;
    }
  </style>
</head>
